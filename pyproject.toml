[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "steampie"
authors = [
    { name="offish", email="overutilization@gmail.com" },
]
description = "Utilities and tools for interacting with Steam."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["steam", "steampie", "steampy", "steamio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "aiohttp",
    "cryptography",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/offish/steampie"
"Bug Tracker" = "https://github.com/offish/steampie/issues"

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"
